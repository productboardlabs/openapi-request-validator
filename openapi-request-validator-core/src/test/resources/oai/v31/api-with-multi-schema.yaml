openapi: 3.1.0
info:
  title: Report API
  version: 1.0.0
paths:
  /reports/{reportId}/{detailedView}:
    get:
      parameters:
      - name: reportId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ReportId"
      - name: detailedView
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/DetailedView"
      - name: includeSummary
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Report details
components:
  schemas:
    ReportId:
      type: integer
      minimum: 1
      maximum: 9
    DetailedView:
      type:
      - boolean
      - integer
      - string
