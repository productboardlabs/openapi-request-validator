openapi: 3.1.0
info:
  title: Multi-Type Body Field (OAS 3.1)
  version: 1.0.0

paths:
  /users:
    post:
      summary: Create or Update User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  # OAS 3.1: Clean array syntax for mixed types
                  type: ["integer", "string"]
                  description: "User ID (can be numeric 101 or UUID string)"
                name:
                  type: string
      responses:
        '200':
          description: Operation successful (No content returned)